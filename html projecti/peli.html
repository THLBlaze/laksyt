
<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hävittäjäpeli</title>
<style>
* { box-sizing:border-box; }
body {
  margin:0;
  background:#071426;
  color:white;
  font-family:Arial;
  text-align:center;
  overflow:hidden;
}
h1 { margin:12px 0 5px; color:#55d6ff; }
#info { margin:8px; font-size:18px; }
canvas {
  background:linear-gradient(#102c50,#286b91);
  border:3px solid #55d6ff;
  border-radius:12px;
  max-width:95vw;
  max-height:75vh;
  touch-action:none;
}
button {
  background:#00aaff;
  color:white;
  border:0;
  padding:12px 22px;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
  margin:8px;
}
#controls { display:flex; justify-content:center; gap:12px; }
</style>
</head>
<body>

<h1>✈️ SKY FIGHTER</h1>
<div id="info">
  Pisteet: <span id="score">0</span>
  &nbsp; ❤️ Elämät: <span id="lives">3</span>
</div>

<canvas id="game" width="420" height="620"></canvas>
<br>
<button onclick="restart()">ALOITA / UUDELLEEN</button>
<div id="controls">
<button id="left">⬅️</button>
<button id="shoot">🔥 AMMU</button>
<button id="right">➡️</button>
</div>

<script>
const c = document.getElementById("game");
const ctx = c.getContext("2d");

let player, enemies, bullets, score, lives;
let keys = {};
let running = false;
let spawn = 0;
let frame = 0;

function restart() {
  player = {x:190,y:520,w:40,h:55};
  enemies = [];
  bullets = [];
  score = 0;
  lives = 3;
  spawn = 0;
  frame = 0;
  running = true;
  document.getElementById("score").textContent=score;
  document.getElementById("lives").textContent=lives;
  requestAnimationFrame(loop);
}

document.addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.code==="Space") e.preventDefault();
});
document.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});

function hold(id,key) {
  const b=document.getElementById(id);
  b.addEventListener("pointerdown",e=>{
    e.preventDefault(); keys[key]=true;
  });
  b.addEventListener("pointerup",()=>keys[key]=false);
  b.addEventListener("pointerleave",()=>keys[key]=false);
  b.addEventListener("pointercancel",()=>keys[key]=false);
}
hold("left","arrowleft");
hold("right","arrowright");
hold("shoot"," ");

function drawPlane(x,y,color,enemy=false) {
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(x+20,y);
  ctx.lineTo(x+39,y+43);
  ctx.lineTo(x+20,y+34);
  ctx.lineTo(x+1,y+43);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle="#d8f5ff";
  ctx.fillRect(x+16,y+14,8,12);
  ctx.fillStyle=color;
  ctx.fillRect(x+7,y+38,26,9);
}

function loop() {
  if(!running) return;
  frame++;

  ctx.clearRect(0,0,420,620);

  // Taustan tähdet
  ctx.fillStyle="white";
  for(let i=0;i<35;i++){
    let x=(i*83)%420;
    let y=(i*137+frame*2)%620;
    ctx.fillRect(x,y,2,2);
  }

  // Pelaaja
  if(keys.arrowleft || keys.a) player.x-=5;
  if(keys.arrowright || keys.d) player.x+=5;
  if(keys.arrowup || keys.w) player.y-=4;
  if(keys.arrowdown || keys.s) player.y+=4;
  player.x=Math.max(0,Math.min(380,player.x));
  player.y=Math.max(0,Math.min(565,player.y));

  drawPlane(player.x,player.y,"#00d9ff");

  // Ammukset
  if((keys[" "] || keys.space) && frame%10===0){
    bullets.push({x:player.x+18,y:player.y});
  }

  bullets.forEach((b,i)=>{
    b.y-=9;
    ctx.fillStyle="#ffff55";
    ctx.fillRect(b.x,b.y,5,15);
    if(b.y<0) bullets.splice(i,1);
  });

  // Viholliset
  spawn++;
  if(spawn>55){
    enemies.push({
      x:Math.random()*370,
      y:-55,
      speed:2+Math.random()*2
    });
    spawn=0;
  }

  enemies.forEach((e,i)=>{
    e.y+=e.speed+score/5000;
    drawPlane(e.x,e.y,"#ff4141",true);

    // Osuma viholliseen
    bullets.forEach((b,j)=>{
      if(b.x<e.x+40 && b.x+5>e.x &&
         b.y<e.y+45 && b.y+15>e.y){
        enemies.splice(i,1);
        bullets.splice(j,1);
        score+=100;
        document.getElementById("score").textContent=score;
      }
    });

    // Vihollinen pääsee ohi
    if(e.y>620){
      enemies.splice(i,1);
      lives--;
      document.getElementById("lives").textContent=lives;
    }
  });

  // Törmäykset
  enemies.forEach((e,i)=>{
    if(player.x<e.x+35 && player.x+40>e.x &&
       player.y<e.y+45 && player.y+55>e.y){
      enemies.splice(i,1);
      lives--;
      document.getElementById("lives").textContent=lives;
    }
  });

  if(lives<=0){
    running=false;
    ctx.fillStyle="rgba(0,0,0,.8)";
    ctx.fillRect(0,0,420,620);
    ctx.fillStyle="white";
    ctx.textAlign="center";
    ctx.font="bold 36px Arial";
    ctx.fillText("PELI OHI!",210,270);
    ctx.font="22px Arial";
    ctx.fillText("Pisteet: "+score,210,320);
    ctx.fillText("Paina ALOITA pelataksesi uudelleen",210,365);
    return;
  }

  requestAnimationFrame(loop);
}

restart();
</script>
</body>
</html>
